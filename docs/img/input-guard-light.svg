<svg xmlns="http://www.w3.org/2000/svg" width="720" height="222" viewBox="0 0 720 222" role="img" aria-label="Input guard on attack types it has never seen" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'><title>Input guard on attack types it has never seen</title><rect x="0.5" y="0.5" width="719" height="221" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="28" y="40" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Input guard on attack types it has never seen</text><rect x="28" y="62" width="324" height="138" rx="10" fill="#f3f2ee"/><text x="48" y="120" font-size="46" font-weight="600" fill="#0b0b0b" text-anchor="start">92%</text><text x="48" y="148" font-size="15" font-weight="500" fill="#0b0b0b" text-anchor="start">of extraction attempts caught</text><text x="48" y="170" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">blocked or flagged · 95% CI 88–95%</text><text x="48" y="188" font-size="12" font-weight="400" fill="#898781" text-anchor="start">267 attacks of 11 types, each type held out of training</text><rect x="368" y="62" width="324" height="138" rx="10" fill="#f3f2ee"/><text x="388" y="120" font-size="46" font-weight="600" fill="#0b0b0b" text-anchor="start">0.04%</text><text x="388" y="148" font-size="15" font-weight="500" fill="#0b0b0b" text-anchor="start">of normal prompts blocked</text><text x="388" y="170" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">at most 0.09% (95% upper bound)</text><text x="388" y="188" font-size="12" font-weight="400" fill="#898781" text-anchor="start">10,000 real user prompts from WildChat-1M</text></svg>
