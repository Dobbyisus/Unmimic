<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426" role="img" aria-label="Does hiding the reasoning stop a copycat?" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'><title>Does hiding the reasoning stop a copycat?</title><rect x="0.5" y="0.5" width="719" height="425" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><text x="28" y="40" font-size="18" font-weight="600" fill="#f0efec" text-anchor="start">Does hiding the reasoning stop a copycat?</text><text x="28" y="63" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">GSM8K accuracy (1,319 test problems) after training on ~2,600 replies from the protected model</text><rect x="28" y="84" width="12" height="12" rx="3" fill="#6b6a64"/><text x="46" y="95" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Untrained</text><rect x="119.6" y="84" width="12" height="12" rx="3" fill="#3987e5"/><text x="137.6" y="95" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Trained on full reasoning</text><rect x="313.6" y="84" width="12" height="12" rx="3" fill="#d95926"/><text x="331.6" y="95" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Trained through Unmimic</text><line x1="70" y1="330.0" x2="690" y2="330.0" stroke="#383835"/><text x="60" y="334.0" font-size="11" font-weight="400" fill="#898781" text-anchor="end">0%</text><line x1="70" y1="279.5" x2="690" y2="279.5" stroke="#2c2c2a"/><text x="60" y="283.5" font-size="11" font-weight="400" fill="#898781" text-anchor="end">25%</text><line x1="70" y1="229.0" x2="690" y2="229.0" stroke="#2c2c2a"/><text x="60" y="233.0" font-size="11" font-weight="400" fill="#898781" text-anchor="end">50%</text><line x1="70" y1="178.5" x2="690" y2="178.5" stroke="#2c2c2a"/><text x="60" y="182.5" font-size="11" font-weight="400" fill="#898781" text-anchor="end">75%</text><line x1="70" y1="128.0" x2="690" y2="128.0" stroke="#2c2c2a"/><text x="60" y="132.0" font-size="11" font-weight="400" fill="#898781" text-anchor="end">100%</text><line x1="70" y1="156.078" x2="690" y2="156.078" stroke="#c3c2b7" stroke-width="1"/><text x="690" y="150.078" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="end">Protected model 86%</text><path d="M185.4,330 V276.228 Q185.4,272.228 189.4,272.228 H209.4 Q213.4,272.228 213.4,276.228 V330 Z" fill="#6b6a64"/><text x="199.4" y="265.228" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">29%</text><path d="M223.4,330 V274.20799999999997 Q223.4,270.20799999999997 227.4,270.20799999999997 H247.4 Q251.4,270.20799999999997 251.4,274.20799999999997 V330 Z" fill="#3987e5"/><text x="237.4" y="263.20799999999997" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">30%</text><path d="M261.4,330 V252.796 Q261.4,248.796 265.4,248.796 H285.4 Q289.4,248.796 289.4,252.796 V330 Z" fill="#d95926"/><text x="275.4" y="241.796" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">40%</text><text x="237.4" y="352" font-size="13" font-weight="500" fill="#c3c2b7" text-anchor="middle">Qwen2.5-0.5B copycat</text><path d="M470.5999999999999,330 V215.426 Q470.5999999999999,211.426 474.5999999999999,211.426 H494.5999999999999 Q498.5999999999999,211.426 498.5999999999999,215.426 V330 Z" fill="#6b6a64"/><text x="484.5999999999999" y="204.426" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">59%</text><path d="M508.5999999999999,330 V206.336 Q508.5999999999999,202.336 512.5999999999999,202.336 H532.5999999999999 Q536.5999999999999,202.336 536.5999999999999,206.336 V330 Z" fill="#3987e5"/><text x="522.5999999999999" y="195.336" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">63%</text><path d="M546.5999999999999,330 V204.114 Q546.5999999999999,200.114 550.5999999999999,200.114 H570.5999999999999 Q574.5999999999999,200.114 574.5999999999999,204.114 V330 Z" fill="#d95926"/><text x="560.5999999999999" y="193.114" font-size="12" font-weight="600" fill="#f0efec" text-anchor="middle">64%</text><text x="522.5999999999999" y="352" font-size="13" font-weight="500" fill="#c3c2b7" text-anchor="middle">Qwen2.5-1.5B copycat</text><text x="28" y="388" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Small copycats learn from the short visible answer, not the long hidden reasoning, so hiding it</text><text x="28" y="405" font-size="12" font-weight="400" fill="#898781" text-anchor="start">doesn't slow them down. Larger copycats (7B+) are not tested yet.</text></svg>
