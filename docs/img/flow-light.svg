<svg xmlns="http://www.w3.org/2000/svg" width="720" height="656" viewBox="0 0 720 656" role="img" aria-label="How a request flows through Unmimic" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'><title>How a request flows through Unmimic</title><rect x="0.5" y="0.5" width="719" height="655" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="28" y="40" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">How a request flows through Unmimic</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect x="85.0" y="64" width="330" height="44" rx="10" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1"/><text x="250" y="86.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Request from a user</text><line x1="250" y1="108" x2="250" y2="136" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="85.0" y="138" width="330" height="60" rx="10" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1"/><text x="250" y="164" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Input guard</text><text x="250" y="183" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">Is this an attempt to extract the reasoning?</text><line x1="415.0" y1="168" x2="498" y2="168" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="457.5" y="160" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">yes</text><rect x="500" y="144" width="192" height="48" rx="10" fill="#fcfcfb" stroke="#d03b3b" stroke-width="2"/><text x="596" y="165" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">✕  Blocked (403)</text><text x="596" y="182" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">never reaches the model</text><line x1="250" y1="198" x2="250" y2="226" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="260" y="217.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">no</text><rect x="85.0" y="228" width="330" height="60" rx="10" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1"/><text x="250" y="254" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Your model</text><text x="250" y="273" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">vLLM, Ollama, any OpenAI-compatible server</text><line x1="250" y1="288" x2="250" y2="316" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="260" y="307.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">reply = hidden reasoning + answer</text><rect x="85.0" y="318" width="330" height="60" rx="10" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1"/><text x="250" y="344" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Split reasoning from answer</text><text x="250" y="363" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">format learned once by  unmimic init</text><line x1="250" y1="378" x2="250" y2="406" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="85.0" y="408" width="330" height="60" rx="10" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1"/><text x="250" y="434" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Leak detector</text><text x="250" y="453" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">Is the reasoning in the answer? Copied, encoded, translated</text><line x1="415.0" y1="438" x2="498" y2="438" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="457.5" y="430" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">yes</text><rect x="500" y="414" width="192" height="48" rx="10" fill="#fcfcfb" stroke="#d03b3b" stroke-width="2"/><text x="596" y="435" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">✕  Withheld</text><text x="596" y="452" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">answer replaced with a notice</text><line x1="250" y1="468" x2="250" y2="496" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="260" y="487.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">no</text><rect x="85.0" y="498" width="330" height="60" rx="10" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1"/><text x="250" y="524" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Strip the reasoning</text><text x="250" y="543" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">remove &lt;think&gt; blocks and reasoning fields</text><line x1="250" y1="558" x2="250" y2="586" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="85.0" y="588" width="330" height="44" rx="10" fill="#f3f2ee" stroke="#0ca30c" stroke-width="2"/><text x="250" y="610.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">✓  User gets the answer only</text></svg>
