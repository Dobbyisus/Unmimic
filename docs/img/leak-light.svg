<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" role="img" aria-label="Hidden reasoning that reached the attacker" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'><title>Hidden reasoning that reached the attacker</title><rect x="0.5" y="0.5" width="719" height="235" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="28" y="40" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Hidden reasoning that reached the attacker</text><text x="28" y="63" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">267 extraction attacks on DeepSeek-R1-0528-Qwen3-8B · share of complete replies</text><text x="204" y="117" font-size="14" font-weight="500" fill="#0b0b0b" text-anchor="end">Model served directly</text><path d="M220,100 H616.0 Q620.0,100 620.0,104 V120 Q620.0,124 616.0,124 H220 Z" fill="#b5b3ab"/><text x="630.0" y="117" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">100%</text><text x="204" y="169" font-size="14" font-weight="500" fill="#0b0b0b" text-anchor="end">Through Unmimic</text><path d="M220,152 H223.20000000000002 Q226.4,152 226.4,155.2 V172.8 Q226.4,176 223.20000000000002,176 H220 Z" fill="#2a78d6"/><text x="236.4" y="169" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">1.6%</text><line x1="220" y1="92" x2="220" y2="184" stroke="#c3c2b7"/><text x="272" y="169" font-size="12" font-weight="400" fill="#898781" text-anchor="start">all from one bug (a second &lt;/think&gt;), fixed in 0.1.0</text><text x="28" y="214" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Without a guard, a server that passes &lt;think&gt; through sends the full reasoning with every reply.</text></svg>
