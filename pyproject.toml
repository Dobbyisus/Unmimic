[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unmimic"
dynamic = ["version"]
description = "Model-agnostic middleware that protects LLMs served over an OpenAI-compatible API from distillation attacks."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jayraj Tiwari" }]
keywords = ["llm", "distillation", "security", "reasoning", "guardrails", "openai", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Classifiers, embeddings and the account monitor. CPU is enough.
ml = [
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    # pyarrow needs it on Windows to read timezone-aware columns (WildChat timestamps).
    "tzdata; sys_platform == 'win32'",
]
# Teacher traces and student training. Install on the GPU machine only.
# vLLM and Unsloth are installed there by infra/aws/setup.sh, not from here.
experiments = [
    "accelerate>=0.33",
    "datasets>=2.20",
    "peft>=0.12",
    "transformers>=4.44",
    "trl>=0.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Dobbyisus/Unmimic"
Repository = "https://github.com/Dobbyisus/Unmimic"
Issues = "https://github.com/Dobbyisus/Unmimic/issues"

[project.scripts]
unmimic = "unmimic.cli:main"

[tool.hatch.version]
path = "src/unmimic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unmimic"]

# The input guard's built-in data, shipped inside the package so `pip install unmimic`
# works outside a checkout (see unmimic/resources.py). Never attacks/private.
[tool.hatch.build.targets.wheel.force-include]
"attacks/public" = "unmimic/_bundled/attacks/public"
"benign/hard_negatives.yaml" = "unmimic/_bundled/benign/hard_negatives.yaml"

[tool.hatch.build.targets.sdist]
include = ["/src/", "/attacks/public/", "/benign/", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
