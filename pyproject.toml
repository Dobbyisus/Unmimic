[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unmimic"
version = "0.0.1"
description = "Model-agnostic middleware that protects LLMs served over an OpenAI-compatible API from distillation attacks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Classifiers, embeddings and the account monitor. CPU is enough.
ml = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
]
# Teacher traces and student training. Install on the GPU machine only.
# vLLM and Unsloth are installed there by infra/aws/setup.sh, not from here.
experiments = [
    "accelerate>=0.33",
    "datasets>=2.20",
    "peft>=0.12",
    "transformers>=4.44",
    "trl>=0.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
unmimic = "unmimic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unmimic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
